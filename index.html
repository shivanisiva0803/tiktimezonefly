<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TickTimeZoneFly.com - Time Zone Converter</title>

<!-- LIBRARIES -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>

<style>
:root {
    --primary:#0284c7;
    --primary-dark:#0369a1;
    --bg:#f8fafc;
    --text:#334155;
    --border:#cbd5e1;
}

/* DARK MODE */
body.dark {
    background:#0f172a;
    color:#e2e8f0;
}
body.dark .card,
body.dark .dropdown,
body.dark .dashboard-card {
    background:#1e293b;
    border-color:#334155;
}
body.dark header {
    background:#020617;
}

/* BASIC */
body { margin:0; font-family:Segoe UI; background:var(--bg); color:var(--text); }

header {
    background:var(--primary);
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.container { display:flex; padding:20px; gap:20px; }

.search-bar {
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.search-input {
    flex:1;
    padding:12px;
    border:2px solid var(--border);
    border-radius:8px;
}

.dropdown {
    position:absolute;
    background:white;
    border:1px solid var(--border);
    width:300px;
    max-height:300px;
    overflow:auto;
    display:none;
    z-index:10;
}

.dropdown-item {
    padding:10px;
    cursor:pointer;
}
.dropdown-item:hover {
    background:#f1f5f9;
}

/* SWITCH */
.switch {
  position: relative;
  display: inline-block;
  width: 42px;
  height: 22px;
}
.switch input { display:none; }
.slider {
  position:absolute;
  cursor:pointer;
  background:#ccc;
  border-radius:20px;
  top:0; left:0; right:0; bottom:0;
}
.slider:before {
  content:"";
  position:absolute;
  height:18px; width:18px;
  left:2px; bottom:2px;
  background:white;
  border-radius:50%;
  transition:.3s;
}
input:checked + .slider {
  background:var(--primary);
}
input:checked + .slider:before {
  transform:translateX(20px);
}
</style>
</head>

<body>

<header>
    <h2>TickTimeZoneFly</h2>

    <div style="display:flex; gap:15px; align-items:center;">
        <span>Dark</span>
        <label class="switch">
            <input type="checkbox" id="darkToggle">
            <span class="slider"></span>
        </label>
    </div>
</header>

<div class="container">

    <div style="width:100%;">

        <!-- SEARCH + DATE -->
        <div class="search-bar">

            <input id="timeInput" placeholder="Pick date & time">

            <input id="fromTimezone" class="search-input" placeholder="Search city...">

            <div style="position:relative;">
                <div id="dropdown" class="dropdown"></div>
            </div>

        </div>

        <div id="currentTime"></div>

        <button onclick="convertTime()">Convert</button>
        <button onclick="swapTimezones()">Swap</button>
        <button onclick="setNow()">Now</button>

        <div id="result"></div>

    </div>
</div>

<script>
const DateTime = luxon.DateTime;
let fp;
const GEO_USERNAME = "sathwi";

/* POPULAR */
const popularCities = [
    ["Hyderabad","India","IN","Asia/Kolkata"],
    ["New York","USA","US","America/New_York"],
    ["London","UK","GB","Europe/London"],
    ["Tokyo","Japan","JP","Asia/Tokyo"]
];

/* INIT */
document.addEventListener("DOMContentLoaded", () => {

    fp = flatpickr("#timeInput", {
        enableTime:true,
        dateFormat:"Y-m-d H:i",
        defaultDate:new Date()
    });

    initSelect("#fromTimezone");
    initSelect("#toTimezone");

    selectDefault("#fromTimezone","Hyderabad","India","IN","Asia/Kolkata");
    selectDefault("#toTimezone","New York","USA","US","America/New_York");

    updateCurrentTime();
});

/* FLAGS */
function flagEmoji(code){
    if(!code) return "🌍";
    return code.toUpperCase().replace(/./g,c =>
        String.fromCodePoint(127397 + c.charCodeAt())
    );
}

/* SELECT INIT */
function initSelect(selector){

    const data = popularCities.map(c=>({
        id:c[3],
        city:c[0],
        country:c[1],
        countryCode:c[2],
        timezone:c[3]
    }));

    $(selector).select2({
        data,
        width:"100%",
        templateResult:item=> item.city ?
            `📍 ${item.city} ${flagEmoji(item.countryCode)}`
            : item.text,
        templateSelection:item=> item.city ?
            `${item.city} ${flagEmoji(item.countryCode)}`
            : item.text
    });

    $(selector).on("change",updateCurrentTime);
}

/* GEO SEARCH */
async function handleSearch(e){
    const q = e.target.value;

    if(q.length<2){
        document.getElementById("dropdown").style.display="none";
        return;
    }

    const res = await fetch(
        `https://secure.geonames.org/searchJSON?q=${q}&maxRows=8&username=${GEO_USERNAME}`
    );

    const data = await res.json();

    const html = data.geonames.map(c=>`
        <div class="dropdown-item" onclick="selectCity('${c.name}','${c.countryCode}','${c.timezone}')">
            📍 ${c.name} ${flagEmoji(c.countryCode)} <br>
            <small>${c.countryName}</small>
        </div>
    `).join("");

    const dd = document.getElementById("dropdown");
    dd.innerHTML = html;
    dd.style.display="block";
}

function selectCity(city,code,tz){
    $("#fromTimezone").append(new Option(city,tz,true,true)).trigger("change");
    document.getElementById("dropdown").style.display="none";
}

/* TIME */
function updateCurrentTime(){
    const zone = $("#fromTimezone").val();
    document.getElementById("currentTime").innerText =
        DateTime.now().setZone(zone).toString();
}

/* CONVERT */
function convertTime(){

    const d = fp.selectedDates[0];
    const from = $("#fromTimezone").val();
    const to = $("#toTimezone").val();

    const source = DateTime.fromJSDate(d,{zone:from});
    const converted = source.setZone(to);

    document.getElementById("result").innerHTML = `
        <h2>${converted.toFormat("dd LLL yyyy hh:mm a")}</h2>
        <p>${from} ➜ ${to}</p>
    `;
}

/* SWAP */
function swapTimezones(){
    const a=$("#fromTimezone").val();
    const b=$("#toTimezone").val();

    $("#fromTimezone").val(b).trigger("change");
    $("#toTimezone").val(a).trigger("change");
}

/* NOW */
function setNow(){
    fp.setDate(new Date());
}

/* DARK MODE */
document.getElementById("darkToggle").addEventListener("change",e=>{
    document.body.classList.toggle("dark",e.target.checked);
});

/* EVENTS */
document.getElementById("fromTimezone").addEventListener("input",handleSearch);

</script>

</body>
</html>
